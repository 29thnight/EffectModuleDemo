<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      인라인 SVG 파비콘. 없으면 브라우저가 /favicon.ico를 암묵적으로 요청하고
      404가 콘솔에 남는다. "콘솔 에러 0건"을 검증 항목으로 걸어놨으므로,
      사소해도 진짜 0으로 만들어 두는 편이 맞다. 파일도 요청도 늘지 않는다.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='5' fill='%23ff7a2a'/></svg>"
    />
    <title>ImpactBurst - 재사용 가능한 이펙트 모듈 데모</title>
    <style>
      /* 캔버스가 뷰포트를 꽉 채우게만 한다. 나머지 스타일은 패널이 자기 CSS로 가져간다. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070b;
        overflow: hidden;
      }
      #viewport {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
